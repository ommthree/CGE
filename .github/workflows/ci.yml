name: CI

# Gates every push and PR on the same checks the project runs locally:
# ruff lint + format, the pytest suite, and the standing model-validation battery.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor (3.11, the requires-python minimum) and a current interpreter.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Core + the CGE solver extra (scipy) + dev tooling (pytest, ruff) + the DATA extra
        # (pymrio/duckdb/pyarrow) + streamlit for the GUI tests. The data extra is REQUIRED, not
        # optional: cge.data.adapters.exiobase and cge.data.build import pymrio at module level, so
        # the data-layer and nature integration tests fail at COLLECTION (not skip) without it
        # (review P1 round 8 2026-08-14). The nature integration tests also genuinely build pymrio
        # systems, so CI must actually exercise them.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cge,dev,data]" "streamlit>=1.33"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Structural artifact reproduces from source digest (pipeline step 1a)
        run: python scripts/build_structural_trajectories.py --check

      - name: Structural source digest matches raw extraction (pipeline step 1a-data)
        # No-op (exit 0) when the raw source files are absent, as they are in CI (large, separately
        # licensed — see data/structural/sources/raw/README.md); when present it fails on drift.
        run: python scripts/extract_structural_sources.py --check

      - name: Pytest
        run: pytest -q

      - name: Model validation battery (strict)
        run: python scripts/validate.py --strict

  # A single job that installs the EXACT pinned versions in constraints.txt, so the
  # "reproducible deployment" claim (constraints.txt / pyproject note) is actually TESTED, not just
  # asserted (review P2 2026-08-31: CI previously never used -c constraints.txt, and the review env
  # differed from the pins). Runs the same gates on the pinned toolchain.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned pip + uv (the resolver)
        # pip is pinned in constraints.txt; uv provides the hash-pinned resolver for the lock.
        run: |
          python -m pip install --upgrade "pip==24.3.1"
          python -m pip install "uv==0.9.6"

      - name: Verify requirements.lock is up to date
        # Recompiles the hash-pinned, resolver-complete lock from pyproject + constraints.txt and
        # fails if the committed requirements.lock drifts. Upload the artifact below so a drifted lock
        # can be committed. Makes "reproducible" a TESTED lock, not an assertion (review P2
        # 2026-09-05: pip freeze was neither hash-pinned nor resolver-complete).
        run: |
          if ! git ls-files --error-unmatch requirements.lock >/dev/null 2>&1; then
            echo "requirements.lock is not committed — run scripts/gen_lock.py and commit it."
            exit 1
          fi
          python scripts/gen_lock.py --check

      - name: Regenerate lock for the artifact (on failure, to commit)
        if: failure()
        run: python scripts/gen_lock.py || true

      - name: Upload the (re)generated lock
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: requirements-lock
          path: requirements.lock

      - name: Prove a clean install FROM the lock (hashes enforced) + pip check
        # The reviewer's key requirement: prove a FRESH environment installs from the lock alone,
        # with hashes enforced, and has a consistent dependency graph (review P2 2026-09-05).
        run: |
          python -m venv /tmp/lockenv
          /tmp/lockenv/bin/python -m pip install --upgrade "pip==24.3.1"
          /tmp/lockenv/bin/pip install --require-hashes -r requirements.lock
          /tmp/lockenv/bin/pip check

      - name: Install the project under constraints (for the gates below)
        run: pip install -e ".[cge,dev,data,gui]" -c constraints.txt

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Pytest
        run: pytest -q

      - name: Model validation battery (strict)
        run: python scripts/validate.py --strict
