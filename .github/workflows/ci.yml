name: CI

# Gates every push and PR on the same checks the project runs locally:
# ruff lint + format, the pytest suite, and the standing model-validation battery.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor (3.11, the requires-python minimum) and a current interpreter.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Core + the CGE solver extra (scipy) + dev tooling (pytest, ruff), plus streamlit so the
        # GUI page/service tests run rather than skip. pymrio/duckdb are intentionally omitted — the
        # handful of tests needing them skip cleanly (as they do in local dev), keeping CI light.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cge,dev]" "streamlit>=1.33"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Pytest
        run: pytest -q

      - name: Model validation battery (strict)
        run: python scripts/validate.py --strict
