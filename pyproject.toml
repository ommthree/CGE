[project]
name = "cge"
version = "0.0.0"
description = "Open, modular CGE/IAM platform with a nature (ENCORE) extension"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Owen Matthews" }]
dependencies = [
    "pydantic>=2.6",
    # pandas<3: pandas 3.x requires openpyxl>=3.1.5 for xlsx, but pymrio (data extra) caps openpyxl
    # <3.1.1 — so pandas 3.x + pymrio is unsatisfiable. Cap here until pymrio widens its openpyxl
    # range (matches constraints.txt pandas==2.3.3). Reviewed 2026-09-07.
    "pandas>=2.2,<3",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Heavier scientific / data deps land as the phases that need them arrive.
# Kept out of the core install so Phase 0 stays fast to set up.
# The ranges below are LOOSE lower bounds for a broad install. For a REPRODUCIBLE deployment
# (consulting / CI / reproducing a published result) pin to the known-good tested versions:
#     pip install -e '.[data,cge,gui,dev]' -c constraints.txt   (see constraints.txt).
# openpyxl (structural-data extractors read PWT/EU KLEMS .xlsx) is declared explicitly so it is
# guaranteed present; the version floor is 3.1 (pandas<3's openpyxl min) and pymrio caps it <3.1.1.
data = ["pymrio>=0.5", "duckdb>=0.10", "pyarrow>=15", "openpyxl>=3.1"]
cge = ["pyomo>=6.7", "scipy>=1.12"]
# The GUI reads the data store and exports Parquet, so it needs the data deps too.
gui = ["streamlit>=1.33", "altair>=5", "pymrio>=0.5", "duckdb>=0.10", "pyarrow>=15"]
dev = ["pytest>=8", "ruff>=0.4", "pre-commit>=3.7"]

[project.scripts]
cge = "cge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# "src" makes the cge package importable; "." puts the repo root on the path so tests can import
# the top-level scripts/ package (e.g. scripts.extract_structural_sources) regardless of cwd — CI
# runs from the repo root but does not otherwise have it on sys.path (2026-09-06).
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
